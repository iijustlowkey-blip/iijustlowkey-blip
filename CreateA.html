<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit Games - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Matches the cyan-to-blue gradient from the create account screenshot */
            background: linear-gradient(135deg, #42d1db, #266cc6);
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 8%;
            position: relative;
            overflow: hidden;
        }

        /* Top Title */
        .create-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Form Layout */
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 1.5rem;
            font-weight: 900;
            color: #000000;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* Custom Banner-style Input Field */
        .banner-input {
            position: relative;
            background: #ffffff;
            height: 40px;
            display: flex;
            align-items: center;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
            padding-left: 15px;
            padding-right: 30px;
        }

        .banner-input input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.05rem;
            color: #333333;
        }

        .banner-input input::placeholder {
            color: #333333;
            font-size: 1rem;
        }

        /* Terms of Service Text */
        .terms-text {
            font-size: 0.95rem;
            font-weight: bold;
            color: #000000;
            margin-top: 5px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Thick Black Outlined Action Buttons */
        .btn-outline {
            background: #ffffff;
            color: #000000;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 25px;
            border: 4px solid #000000;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 0px #000000;
            transition: transform 0.1s ease;
        }

        .btn-outline:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #000000;
        }

        /* Create Button Styling */
        .create-btn {
            width: 180px;
        }

        /* Bottom-Right Login Button */
        .bottom-right-button {
            position: absolute;
            bottom: 40px;
            right: 50px;
        }

        .login-side-btn {
            width: 160px;
        }
    </style>
</head>
<body>

    <!-- Main Title -->
    <h1 class="create-title">RABBIT GAMES CREATE ACCOUNT</h1>

    <!-- Create Account Form -->
    <form action="#" method="POST">
        
        <!-- Date of Birth Field -->
        <div class="input-group">
            <label for="dob">DATE OF BIRTH</label>
            <div class="banner-input">
                <input type="text" id="dob" name="dob" placeholder="D/M/Y" required>
            </div>
        </div>

        <!-- Username Field -->
        <div class="input-group">
            <label for="username">USERNAME</label>
            <div class="banner-input">
                <input type="text" id="username" name="username" placeholder="ex:BobbyLovesGames" required>
            </div>
        </div>

        <!-- Password Field -->
        <div class="input-group">
            <label for="password">PASSWORD</label>
            <div class="banner-input">
                <input type="password" id="password" name="password" placeholder="ex:BobbySercetPassword" required>
            </div>
        </div>

        <!-- Rewrite Password Field -->
        <div class="input-group">
            <label for="rewirte-password">REWIRTE PASSWORD</label>
            <div class="banner-input">
                <input type="password" id="rewirte-password" name="rewirte_password" placeholder="ex:BobbySercetPassword" required>
            </div>
        </div>

        <!-- Terms Agreement Notice -->
        <div class="terms-text">
            BY MAKING AN ACCOUNT YOU WILL BE AGREE WITH TERMS SERVICES
        </div>

        <!-- Create Button -->
        <button type="submit" class="btn-outline create-btn">CREATE</button>
    </form>

    <!-- Bottom Right Login Button -->
    <div class="bottom-right-button">
        <a href="login.html" class="btn-outline login-side-btn">Login</a>
    </div>

</body>
</html>
