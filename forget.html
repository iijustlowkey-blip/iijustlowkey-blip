<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit Games - Forget Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Matches the purple-to-light blue/cyan gradient from the login/recovery style */
            background: linear-gradient(135deg, #7d52ef, #5ccce6);
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 8%;
            position: relative;
            overflow: hidden;
        }

        /* Top Title */
        .forget-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Form Layout */
        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 1.8rem;
            font-weight: 900;
            color: #000000;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* Custom Banner-style Input Field */
        .banner-input {
            position: relative;
            background: #ffffff;
            height: 45px;
            display: flex;
            align-items: center;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
            padding-left: 15px;
            padding-right: 30px;
        }

        .banner-input input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.1rem;
            color: #333333;
        }

        .banner-input input::placeholder {
            color: #333333;
            font-size: 1.05rem;
        }

        /* Thick Black Outlined Action Buttons */
        .btn-outline {
            background: #ffffff;
            color: #000000;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 30px;
            border: 4px solid #000000;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 0px #000000;
            transition: transform 0.1s ease;
        }

        .btn-outline:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #000000;
        }

        /* Send Code Button Styling */
        .send-code-btn {
            width: 180px;
            font-size: 1rem;
            padding: 10px 20px;
            margin-bottom: 15px;
        }

        /* Bottom-Right Back to Login Button */
        .bottom-right-button {
            position: absolute;
            bottom: 40px;
            right: 50px;
        }

        .back-login-btn {
            width: 190px;
        }
    </style>
</head>
<body>

    <!-- Main Title -->
    <h1 class="forget-title">RABBIT GAMES FORGET PASSWORD</h1>

    <!-- Form Container -->
    <form action="#" method="POST">
        
        <!-- Email Field -->
        <div class="input-group">
            <label for="email">EMAIL</label>
            <div class="banner-input">
                <input type="email" id="email" name="email" placeholder="ex:BobbyLovesGames@email.bob" required>
            </div>
        </div>

        <!-- Send Code Button -->
        <button type="button" class="btn-outline send-code-btn">Send Code</button>

        <!-- Code Field -->
        <div class="input-group">
            <label for="code">CODE</label>
            <div class="banner-input">
                <input type="text" id="code" name="code" placeholder="ex:1234" required>
            </div>
        </div>

    </form>

    <!-- Bottom Right Back To Login Button -->
    <div class="bottom-right-button">
        <a href="login.html" class="btn-outline back-login-btn">BACK TO LOGIN</a>
    </div>

</body>
</html>
